global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'spark-workers'
    static_configs:
      - targets: ['spark-worker:8081', 'spark-worker-2:8081', 'spark-worker-3:8081', 'spark-worker-4:8081']
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8085']
  - job_name: 'spark-master'
    static_configs:
      - targets: ['spark-master:4040']
